# --- Prefix key ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Quality of life improvements ---
set -g mouse on                    # Enable mouse support
setw -g mode-keys vi               # Use vi keys in copy mode
 # Smart pane switching with vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g history-limit 10000         # Bigger scrollback
set -g base-index 1                # Start window numbering at 1
setw -g pane-base-index 1          # Start pane numbering at 1
set -g renumber-windows on         # Auto renumber when closing windows

# --- Better splits ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# --- Toggle terminal pane height ---
bind C-_ if-shell "[ $(tmux display-message -p '#{pane_height}') -lt 10 ]" \
  "resize-pane -y 20" \
  "resize-pane -y 5; select-pane -t :.-1"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# --- Status bar styling ---
set -g status-interval 5
# set -g status-justify centre
set -g status-bg colour236
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 150

# --- Left side: session info ---
set -g status-left "#[bg=colour24,fg=white,bold] #S #[default]"

# --- Window list styling ---
setw -g window-status-format "#[fg=brightblack] #I #[fg=white]#W "
setw -g window-status-current-format "#[bg=colour24,fg=white,bold] #I #[fg=brightyellow]#W #[default]"
setw -g window-status-separator " "

# --- Right side: time and system info ---
set -g status-right "#[fg=colour154]#(tmux list-sessions | wc -l | xargs -I{} jot -b ● -s '' {}) #[fg=colour24]|#[fg=white] %Y-%m-%d %H:%M "

# --- Pane border colors ---
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# --- Message styling ---
set -g message-style bg=colour24,fg=white
set -g message-command-style bg=colour24,fg=white

# --- Clock mode styling ---
set -g clock-mode-colour colour39

